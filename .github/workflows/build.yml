name: Build TWRP RE6402L1

on:
  workflow_dispatch:
    inputs:
      community_patches:
        description: "Apply TWRP source patches from MissMyTime/twrp_device_sm8850 (neo8)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Add swap
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl \
            zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 \
            libncurses-dev lib32ncurses-dev x11proto-core-dev libx11-dev \
            lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig \
            python3 python3-pip repo bc ccache rsync libssl-dev \
            liblz4-tool lz4 zstd
          git config --global user.name "ci"
          git config --global user.email "ci@example.com"
          git config --global color.ui false

      - name: Build recovery
        env:
          USE_COMMUNITY_PATCHES: ${{ inputs.community_patches && '1' || '0' }}
        run: |
          chmod +x build_own.sh
          ./build_own.sh

      - name: Upload recovery.img
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-RE6402L1
          path: ~/android/twrp/out/target/product/RE6402L1/recovery.img
          if-no-files-found: warn
